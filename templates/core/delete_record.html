{% extends "base.html" %}
{% block title %}Delete Record #{{ record.applicant_no }} — BankDB{% endblock %}
{% block content %}

<div class="page-header">
  <h2>
    <span class="material-symbols-outlined">warning</span> Confirm Deletion
  </h2>
</div>

<div class="card animate-in" style="max-width:560px">
  <div class="card-body p-4">
    <div class="alert alert-warning d-flex align-items-center gap-2 mb-3">
      <span class="material-symbols-outlined icon-fill">error</span>
      This action cannot be undone.
    </div>
    <form method="post">{% csrf_token %}
      <h4 class="fw-bold mb-2">Delete Record #{{ record.applicant_no }}?</h4>
      <p class="mb-4">Name: <strong>{{ record.name }}</strong></p>
      <div class="d-flex gap-2">
        <button class="btn btn-danger">
          <span class="material-symbols-outlined icon-sm">delete</span> Delete
        </button>
        <a class="btn btn-outline-secondary" href="{% url 'records_list' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
